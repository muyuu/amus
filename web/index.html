<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモングアス</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        #splash,
        #root {
            width: 100%;
            height: 100%;
        }

        .box {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0f0f;
        }

        .glitch-spinner {
            width: 100px;
            height: 100px;
            position: relative;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .glitch-bar {
            width: 12px;
            height: 60px;
            background: linear-gradient(to bottom, #00ff41, #00ff41 50%, transparent 50%);
            animation: glitch 1.5s ease-in-out infinite;
            filter: drop-shadow(0 0 5px #00ff41);
        }

        .glitch-bar:nth-child(1) {
            animation-delay: 0s;
        }

        .glitch-bar:nth-child(2) {
            animation-delay: 0.1s;
        }

        .glitch-bar:nth-child(3) {
            animation-delay: 0.2s;
        }

        .glitch-bar:nth-child(4) {
            animation-delay: 0.3s;
        }

        .glitch-bar:nth-child(5) {
            animation-delay: 0.4s;
        }

        @keyframes glitch {

            0%,
            100% {
                height: 60px;
                opacity: 1;
            }

            25% {
                height: 20px;
                opacity: 0.5;
                transform: translateY(-5px);
            }

            50% {
                height: 80px;
                opacity: 1;
            }

            75% {
                height: 40px;
                opacity: 0.7;
                transform: translateY(5px);
            }
        }
    </style>
</head>

<body>
    <div id="loading" class="box">
        <div class="glitch-spinner">
            <div class="glitch-bar"></div>
            <div class="glitch-bar"></div>
            <div class="glitch-bar"></div>
            <div class="glitch-bar"></div>
            <div class="glitch-bar"></div>
        </div>
    </div>

    <div id="root"></div>

    <script type="module" src="./index.js"></script>
</body>

</html>
