[tools]
rust = "stable"

[env]
RUST_BACKTRACE = "1"

# ============================================
# 公開タスク（通常使用するタスク）
# ============================================
[tasks.build]
description = "アプリケーションをビルドする"
run = "cargo build"

[tasks.dev]
description = "開発環境を起動する（アプリ起動 + ファイル監視）"
run = ["mise watch -r start"]

[tasks.dev-check]
description = "コードチェックを監視する（アプリ起動なし、ビルドなし、checkのみ）"
run = "mise watch -r check"

[tasks.verify]
description = "コミット前のコード品質調整（フォーマット + 静的解析）"
depends = ["fmt", "lint"]

[tasks.test]
description = "テストを実行する"
run = "cargo test"

[tasks.analyzer-target-debug]
description = "Rust Analyzerのターゲットを設定する。"
run = "npm run rust-analyzer-target -- debug"

[tasks.analyzer-target-release]
description = "Rust Analyzerのターゲットを設定する。"
run = "npm run rust-analyzer-target -- release"

[tasks.analyzer-target-wasm]
description = "Rust Analyzerのターゲットを設定する。"
run = "npm run rust-analyzer-target -- wasm"

[tasks.release-linux]
description = "Linux用リリースビルドを作成する"
run = '''
  cargo build --release --target x86_64-unknown-linux-gnu
  echo "Linux用バイナリが作成されました:"
  echo "  target/x86_64-unknown-linux-gnu/release/amus"
'''

[tasks.release-windows]
description = "Windows用リリースビルドを作成する（GNU toolchain）"
run = '''
  cargo build --release --target x86_64-pc-windows-gnu
  echo "Windows用バイナリが作成されました:"
  echo "  target/x86_64-pc-windows-gnu/release/amus.exe"
'''

[tasks.release-windows-msvc]
description = "Windows用リリースビルドを作成する（MSVC toolchain）"
run = '''
  cargo build --release --target x86_64-pc-windows-msvc
  echo "Windows用バイナリが作成されました:"
  echo "  target/x86_64-pc-windows-msvc/release/amus.exe"
'''

[tasks.init]
description = "開発環境の初期設定を行う"
run = "bash scripts/init.sh"

# ============================================
# プライベートタスク（内部使用）
# ============================================
[tasks.fmt]
hide = true
description = "コードをフォーマットする"
run = "cargo fmt"

[tasks.lint]
hide = true
description = "コードの静的解析を行う"
run = "cargo clippy"
depends = ["fmt"]

[tasks.start]
hide = true
description = "アプリケーションを起動する"
run = "cargo run"

[tasks.check]
hide = true
description = "コードの構文チェックを行う"
run = "cargo check"

[tasks.watch]
hide = true
description = "ファイル変更を監視する"
run = "mise watch -r start"

[tasks.clean]
hide = true
description = "ビルドの成果物を削除する"
run = "cargo clean"

[tasks.build-wasm]
description = "infoログ出力でWASMを作成する（./web/pkg/ に出力）"
run = '''
  wasm-pack build --release --target web --out-dir ./web/pkg
  echo "WASMビルドが完了しました: ./web/pkg/"
'''

[tasks.build-wasm-debug]
description = "debugログ出力のWASMを作成する（./web/pkg/ に出力）"
env = { RUST_LOG = "debug" }
run = '''
  wasm-pack build --release --target web --out-dir ./web/pkg
  echo "WASMビルドが完了しました: ./web/pkg/"
'''

[tasks.build-wasm-release]
description = "release用にログなしWASMを作成する（./web/pkg/ に出力）"
env = { RUST_LOG = "error" }
run = '''
  wasm-pack build --release --target web --out-dir ./web/pkg
  echo "WASMビルドが完了しました: ./web/pkg/"
'''

[tasks.serve]
description = "ローカルサーバーを起動する（web/ をルート）"
run = "miniserve web --port 8080"
