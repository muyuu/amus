[tools]
rust = "stable"

# ./scripts/ にある各種スクリプト用
# Windows環境でも動作するように Node.js でスクリプト記述
node = "24"

[env]
RUST_BACKTRACE = "1"

[task_config]
includes = [
  ".mise/dev.toml",
  ".mise/build.toml",
  ".mise/init.toml",
  ".mise/quality.toml",
  ".mise/release.toml",
  ".mise/wasm.toml",
  ".mise/analyzer.toml",
]