[tools]
rust = "stable"

[env]
RUST_BACKTRACE = "1"

# ============================================
# 公開タスク（通常使用するタスク）
# ============================================
[tasks.build]
description = "アプリケーションをビルドする"
run = "cargo build"

[tasks.dev]
description = "開発環境を起動する（アプリ起動 + ファイル監視）"
run = ["mise watch -r start"]

[tasks.dev-check]
description = "コードチェックを監視する（アプリ起動なし、ビルドなし、checkのみ）"
run = "mise watch -r check"

[tasks.verify]
description = "コミット前のコード品質調整（フォーマット + 静的解析）"
depends = ["fmt", "lint"]

[tasks.test]
description = "テストを実行する"
run = "cargo test"

[tasks.release]
description = "Linux用リリースビルドを作成する"
run = "cargo build --release"

[tasks.release-windows]
description = "Windows用リリースビルドを作成する（GNU toolchain）"
run = '''
  cargo build --release --target x86_64-pc-windows-gnu
  echo "Windows用バイナリが作成されました:"
  echo "  target/x86_64-pc-windows-gnu/release/amus.exe"
'''

[tasks.release-windows-msvc]
description = "Windows用リリースビルドを作成する（MSVC toolchain）"
run = '''
  cargo build --release --target x86_64-pc-windows-msvc
  echo "Windows用バイナリが作成されました:"
  echo "  target/x86_64-pc-windows-msvc/release/amus.exe"
'''

[tasks.init]
description = "開発環境の初期設定を行う"
run = '''
  # watchexecをインストール（mise watchで使用）
  if mise which watchexec >/dev/null 2>&1; then
    echo "watchexecは既にインストールされています"
  else
    echo "watchexecをインストール中..."
    mise use -g watchexec@latest || {
      echo "警告: watchexecのインストールに失敗しました"
      echo "代替方法: mise use -g watchexec@latest"
    }
  fi

  # Linux用リリースターゲットを追加
  echo "Linux用リリースターゲットを追加中..."
  rustup target add x86_64-unknown-linux-gnu

  # Windows用リリースターゲットを追加
  echo "Windows用リリースターゲットを追加中..."
  rustup target add x86_64-pc-windows-gnu
  rustup target add x86_64-pc-windows-msvc

  # Windows用クロスコンパイルツールをチェック
  echo "Windows用クロスコンパイルツールをチェック中..."
  if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
    echo "mingw-w64は既にインストールされています"
  else
    echo "警告: mingw-w64がインストールされていません"
    echo "Ubuntu/Debian: sudo apt install gcc-mingw-w64-x86-64"
    echo "Fedora: sudo dnf install mingw64-gcc"
    echo "Arch: sudo pacman -S mingw-w64-gcc"
  fi

  echo "ターゲット追加完了"
'''

# ============================================
# プライベートタスク（内部使用）
# ============================================
[tasks.fmt]
hide = true
description = "コードをフォーマットする"
run = "cargo fmt"

[tasks.lint]
hide = true
description = "コードの静的解析を行う"
run = "cargo clippy"
depends = ["fmt"]

[tasks.start]
hide = true
description = "アプリケーションを起動する"
run = "cargo run"

[tasks.check]
hide = true
description = "コードの構文チェックを行う"
run = "cargo check"

[tasks.watch]
hide = true
description = "ファイル変更を監視する"
run = "mise watch -r start"

[tasks.clean]
hide = true
description = "ビルドの成果物を削除する"
run = "cargo clean"
