[tools]
# fmt / clippy 結果を全環境で一致させるためバージョンを固定する。
# 正準は rust-toolchain.toml。更新時は両方を同じ版に揃える。
rust = "1.91.1"

# ./scripts/ にある各種スクリプト用
# Windows環境でも動作するように Node.js でスクリプト記述
node = "24"

# `mise watch`（dev / check-watch タスク）が使うファイル監視ツール
watchexec = "latest"

[env]
RUST_BACKTRACE = "1"

[task_config]
includes = [
  ".mise/dev.toml",
  ".mise/build.toml",
  ".mise/dependencies.toml",
  ".mise/init.toml",
  ".mise/quality.toml",
  ".mise/release.toml",
  ".mise/wasm.toml",
  ".mise/analyzer.toml",
]