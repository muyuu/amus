[tools]
rust = "latest"

[env]
RUST_BACKTRACE = "1"

[tasks.init]
description = "開発に必要なツールをインストールする"
run = '''
  if command -v cargo-watch >/dev/null 2>&1; then
    echo "cargo-watchは既にインストールされています"
  else
    echo "cargo-watchをインストール中..."
    # AppKitフレームワークをリンクするための環境変数を設定
    export RUSTFLAGS="-C link-arg=-framework -C link-arg=AppKit"
    cargo install cargo-watch --locked || {
      echo "警告: cargo-watchのインストールに失敗しました"
      echo "代替方法: 以下のコマンドで手動インストールを試してください:"
      echo "  RUSTFLAGS='-C link-arg=-framework -C link-arg=AppKit' cargo install cargo-watch"
      echo "または、cargo-watchなしでも開発は可能です（mise run watch は使用できません）"
    }
  fi
'''

[tasks.run]
description = "アプリケーションを一度だけ実行する"
run = "cargo run"
depends = ["fmt"]

[tasks.dev]
description = "開発環境を起動する"
depends = ["init", "watch"]

[tasks.watch]
description = "ファイル変更を監視して自動的にアプリを再実行する"
run = '''
  if command -v cargo-watch >/dev/null 2>&1; then
    cargo watch -c -w src -x run
  else
    echo "エラー: cargo-watchがインストールされていません"
    echo "インストールするには: mise run init"
    echo "または手動で: cargo install cargo-watch"
    exit 1
  fi
'''
depends = ["fmt"]

[tasks.build]
description = "アプリケーションをビルドする"
run = "cargo build"
depends = ["fmt"]

[tasks.check]
description = "コードの構文チェックを行う"
run = "cargo check"

[tasks.test]
description = "テストを実行する"
run = "cargo test"
depends = ["fmt"]

[tasks.fmt]
description = "コードをフォーマットする"
run = "cargo fmt"

[tasks.clippy]
description = "Clippyによるコード解析を行う"
run = "cargo clippy"
depends = ["fmt"]

[tasks.clean]
description = "ビルドの成果物を削除する"
run = "cargo clean"

