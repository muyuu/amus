[package]
name = "memongus"
version = "1.2.1"
edition = "2021"

# バイナリターゲット
[[bin]]
name = "memongus"
path = "src/main.rs"

# ライブラリターゲット
[lib]
name = "memongus_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["voice_memo"]
# 音声録音・Whisper 書き起こし（ネイティブ専用）。重い native 依存（cpal / whisper.cpp 等）を
# 抱えるため、テストを軽量化したいときは --no-default-features で切り離せる。
voice_memo = ["dep:cpal", "dep:hound", "dep:whisper-rs", "dep:dirs-next", "dep:ureq", "dep:sha2"]

# 書き起こしの GPU バックエンド。whisper.cpp の都合でビルド時に固定されるため、
# 1 バイナリで全 GPU を賄うことはできない。いずれも default には入れない
# （SDK / Toolkit をビルド環境に要求するため）。配布ビルドは Windows/Linux が
# gpu-vulkan、macOS が gpu-metal。
gpu-vulkan = ["voice_memo", "whisper-rs?/vulkan"]
gpu-cuda = ["voice_memo", "whisper-rs?/cuda"]
gpu-metal = ["voice_memo", "whisper-rs?/metal"]

[dependencies]
# GUI framework - egui is recommended for this use case
# Alternatives: gpui, bevy, iced
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
image = "0.25"
uuid = { version = "1.19", features = ["v4", "serde"] }
include_dir = "0.7"
chrono = { version = "0.4", features = ["serde"] }

# ログ関連
log = "0.4"
env_logger = "0.11"
colored = "3"

# Windows: wgpu + DirectX
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
wgpu = { version = "27", features = ["dx12"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# 音声認識の検証テスト（test-audio/ 配下の mp3 を読む）専用。開発時のみ使う。
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

# Linux: wgpu + Vulkan
[target.'cfg(unix)'.dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
wgpu = { version = "27", features = ["vulkan"] }

# macOS: wgpu + Metal
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
wgpu = { version = "27", features = ["metal"] }

# どのプラットフォームでも使えるフォールバック
[target.'cfg(not(any(windows, unix, target_os = "macos")))'.dependencies]
eframe = { version = "0.33", features = ["glow"] }

# Native only: Audio recording and transcription（voice_memo feature で opt-in）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.17", optional = true }
hound = { version = "3.5", optional = true }
whisper-rs = { version = "0.16", optional = true, features = ["log_backend"] }
dirs-next = { version = "2.0", optional = true }
ureq = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }

# wasm
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.33", features = ["default"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
] }
console_log = "1"
console_error_panic_hook = "0.1"
uuid = { version = "1.19", features = ["v4", "serde", "js"] }

