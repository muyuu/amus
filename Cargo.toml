[package]
name = "amus"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI framework - egui is recommended for this use case
# Alternatives: gpui, bevy, iced
egui = "0.27"
eframe = { version = "0.27", default-features = false, features = [
    "default_fonts",
    "glow",

    # 現代的なGPU描画サポート（推奨）
    "wgpu",

    # Linux Waylandデスクトップサポート（必要）
    "wayland",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"

