[package]
name = "amus"
version = "1.2.1"
edition = "2021"

# バイナリターゲット
[[bin]]
name = "amus"
path = "src/main.rs"

# ライブラリターゲット
[lib]
name = "amus_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# GUI framework - egui is recommended for this use case
# Alternatives: gpui, bevy, iced
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
uuid = { version = "1.19", features = ["v4", "serde"] }
include_dir = "0.7"
chrono = { version = "0.4", features = ["serde"] }

# ログ関連
log = "0.4"
env_logger = "0.11"
colored = "3"

# Windows: wgpu + DirectX
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
wgpu = { version = "27", features = ["dx12"] }

[target.'cfg(windows)'.build-dependencies]
winres = { version = "0.1"}

# Linux: wgpu + Vulkan
[target.'cfg(unix)'.dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
wgpu = { version = "27", features = ["vulkan"] }

# macOS: wgpu + Metal
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
wgpu = { version = "27", features = ["metal"] }

# どのプラットフォームでも使えるフォールバック
[target.'cfg(not(any(windows, unix, target_os = "macos")))'.dependencies]
eframe = { version = "0.33", features = ["glow"] }

# Native only: Audio recording and transcription
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.17"
hound = "3.5"
whisper-rs = "0.15"
dirs-next = "2.0"
ureq = "3"

# wasm
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.33", features = ["default"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
] }
console_log = "1"
console_error_panic_hook = "0.1"
uuid = { version = "1.19", features = ["v4", "serde", "js"] }

