# コード品質タスク
[fmt]
description = "コードをフォーマットする"
run = "cargo fmt"

[lint]
description = "コードの静的解析を行う"
run = "cargo clippy"

[fmt-check]
description = "CI用: フォーマット崩れがないか検査する（書き換えない）"
run = "cargo fmt --check"

[lint-native]
description = "CI用: native ターゲットを警告エラー扱いで静的解析する"
run = "cargo clippy --all-targets -- -D warnings"

[lint-wasm]
# wasm 成果物は lib（trunk がビルド）。native 専用の bin を wasm 用にビルドさせないため lib に絞る。
description = "CI用: wasm ターゲット(lib)を警告エラー扱いで静的解析する"
run = "cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings"

[lint-ci]
description = "CI用: native / wasm 両ターゲットを静的解析する"
depends = ["lint-native", "lint-wasm"]

[test]
description = "テストを実行する"
run = "cargo test"

[verify]
description = "コミット前のコード品質調整（フォーマット + 静的解析）"
depends = ["fmt", "lint"]

["pre-push"]
# .githooks/pre-push から呼ばれる push 前ゲート。
# CI が PR で見ない native clippy・test を含め、マージゲート相当をローカルで通す。
description = "push 前ゲート: フォーマット検査 + 静的解析(native/wasm) + テスト"
depends = ["fmt-check", "lint-ci", "test"]
