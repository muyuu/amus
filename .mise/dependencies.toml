["install-all"]
description = "全ての依存パッケージをインストール"
depends = [
    "install-cargo-packages",
    "install-rust-build-tools",
    "install-npm-packages",
    "install-dev-tools",
]

["install-cargo-packages"]
description = "Rust依存パッケージをインストール"
run = "cargo fetch"
hide = true

["install-rust-build-tools"]
description = "Rustビルドツール関連をインストール"
depends = ["install-wasm-pack"]
hide = true

["install-rust-toolchain"]
description = "CI用: Rustツールチェイン関連をインストール"
# rustup を並列で走らせると、未インストールの toolchain を複数プロセスが同時に
# ダウンロードして競合する（downloads/*.partial の rename に失敗する）。
# depends を1本の鎖（target → components）にして直列実行を強制する。
# 先頭の install-target-wasm32 が toolchain 本体のインストールも兼ねる。
depends = ["install-rust-components"]
hide = true

["install-rust-components"]
# mise が RUSTUP_TOOLCHAIN を設定すると rust-toolchain.toml の components 指定が
# 無視されるため、fmt / clippy で必要な component を明示的に入れる。
description = "rustfmt / clippy component をインストール"
depends = ["install-target-wasm32"]
run = "rustup component add rustfmt clippy"
hide = true

["install-npm-packages"]
description = "npmパッケージをインストール"
run = "npm install"
hide = true

["install-dev-tools"]
description = "開発用ツールをインストール"
depends = ["install-cargo-watch", "install-miniserve"]
hide = true

["install-target-wasm32"]
description = "wasm32-unknown-unknownターゲットをインストール"
run = "rustup target add wasm32-unknown-unknown"
hide = true

["install-wasm-pack"]
description = "wasm-packをインストール"
run = "cargo install wasm-pack"
hide = true

["install-cargo-watch"]
description = "cargo-watchをインストール"
run = "cargo install cargo-watch"
hide = true

["install-miniserve"]
description = "miniserveをインストール"
run = "cargo install miniserve"
hide = true
