# ビルドタスク
[build]
description = "アプリケーションをビルドする（CPU で書き起こし）"
run = "cargo build"

["build-gpu"]
description = "GPU バックエンド付きでビルドする（Windows/Linux は Vulkan、macOS は Metal）"
run = "node scripts/gpu-cargo.js build"

[check]
description = "コードの構文チェックを行う"
run = "cargo check"

[clean]
description = "ビルドの成果物を削除する"
run = "cargo clean"
