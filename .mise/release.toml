# 配布用リリースビルド
#
# 動かすマシンの OS 向けに作る。whisper.cpp と Vulkan のシェーダを含むため
# クロスコンパイルはせず、配布する OS ごとにそのマシンで実行する。
# 成果物は dist/ に置かれる。

["release-cpu"]
description = "CPU 版のリリースビルドを作る（この OS 向け）"
run = "node scripts/release-build.js cpu"

["release-gpu"]
description = "GPU 版のリリースビルドを作る（この OS 向け。Windows/Linux は Vulkan、macOS は Metal）"
run = "node scripts/release-build.js gpu"
