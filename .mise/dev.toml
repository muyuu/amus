# 開発タスク
[dev]
description = "開発環境を起動する（ファイル監視 + 自動リロード）"
run = "mise watch -r start"

[start]
description = "アプリケーションを起動する（CPU で書き起こし）"
run = "cargo run"

["start-gpu"]
description = "GPU バックエンド付きで起動する（Windows/Linux は Vulkan、macOS は Metal）"
run = "node scripts/gpu-cargo.js run"

[start-debug]
description = "アプリケーションを起動する"
env = { RUST_LOG = "debug" }
run = "cargo run"

["start-release"]
description = "リリースビルドでアプリケーションを起動"
env = { RUST_LOG = "error" }
run = "cargo run --release"

["check-watch"]
description = "コードチェックを監視する"
run = "mise watch -r check"
